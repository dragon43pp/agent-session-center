name: Bug report 问题反馈
description: Report a reproducible problem / 报告一个可复现的问题
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. / 感谢你花时间反馈。

        Please search the existing issues first — there is a good chance someone hit the same thing.
        提交前请先搜索现有 issue，大概率已经有人踩过同一个坑：
        https://github.com/fatedawn/agent-session-center/issues

        **Do not report security vulnerabilities in public. / 安全漏洞请不要公开提交** — see the link below the issue chooser.

  - type: input
    id: version
    attributes:
      label: Version 版本号
      description: Shown in Settings → About, or in the installer file name. / 设置 → 关于，或安装包文件名里的版本段。
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system 操作系统
      options:
        - Windows
        - macOS
        - Linux
      validations:
        required: true

  - type: input
    id: harness
    attributes:
      label: CLI / harness 名称
      description: Which coding CLI misbehaved — e.g. Codex CLI, Claude Code, OpenCode, DeepSeek Harness, Grok Build. Write "ASC itself" for a problem with the desktop app. / 出问题的那个 Coding CLI；桌面终端本身的问题请填「ASC 本身」。
      placeholder: "Codex CLI"
    validations:
      required: false

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce 复现步骤
      description: Step by step, starting from launching the app. The more specific, the easier it is to reproduce. / 一步一步写，从打开应用开始。越具体，别人越容易复现。
      placeholder: |
        1. Launch Agent Session Center / 启动 Agent Session Center
        2. Pick Codex CLI, start a session / 扫描到 Codex CLI，创建会话
        3. Ask it to run a command that needs approval / 让它执行一个需要权限确认的命令
        4. Switch to another session and back / 切到别的会话再切回来
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour 期望行为
      description: What you thought would happen. / 你以为会发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour 实际行为
      description: What actually happened? Any error output? / 实际发生了什么？有没有报错？
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs 日志
      description: |
        Paste the relevant log lines below. **Re-read them before you post** — they may contain keys, tokens, or internal hostnames.
        相关日志片段直接贴在下面即可（提交前请先检查是否含有密钥、token 等敏感信息）。

        - Desktop / 桌面端: lines prefixed with `[asc]` in the main-process log
        - Diagnostics / 诊断日志: `[asc] spawn` lines in `logs/asc-diagnostic.jsonl` under your user data directory
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit 提交前自查
      options:
        - label: I searched existing issues and found no duplicate / 我已搜索过现有 issue，没有找到相同问题
          required: true
        - label: I checked the logs I pasted for keys, tokens and internal hosts / 我贴出的日志已检查，不含密钥 / token / 内部地址
          required: false
