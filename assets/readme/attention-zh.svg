<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 512" width="1160" height="512" role="img" aria-label="六个 Agent 会话并排跑，其中一个卡在审批上，推到用户手机，然后在同一个 PTY 里继续。">
  <title>注意力闭环 —— 六个会话在跑，只有一个在等你</title>
  <style>
    :root {
      --plate: #141922;
      --screen: #0E1218;
      --hair: #242C38;
      --ink: #E8EBF0;
      --dim: #8A93A3;
      --faint: #5E6675;
      --working: #F2A93B;
      --needs-you: #FF6B4A;
      --done: #3ECF8E;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --plate: #EDF0F5;
        --screen: #E7EBF2;
        --hair: #DFE4EC;
        --ink: #0F1420;
        --dim: #626C7D;
        --faint: #98A1B0;
      }
    }
    .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", "Microsoft YaHei", monospace; }
    .plate { fill: var(--plate); stroke: var(--hair); stroke-width: 1; }
    .node  { fill: var(--screen); stroke: var(--hair); stroke-width: 1; }
    .track { fill: var(--screen); }
    .hair  { stroke: var(--hair); stroke-width: 1; fill: none; }
    .wire  { stroke: var(--dim); stroke-width: 1.2; fill: none; }
    .away  { fill: var(--hair); opacity: 0.5; }
    .label { fill: var(--faint); font-size: 10px; letter-spacing: 3.4px; }
    .title { fill: var(--ink); font-size: 26px; font-weight: 700; letter-spacing: -1.2px; }
    .step  { fill: var(--ink); font-size: 13px; font-weight: 600; letter-spacing: 0.6px; }
    .body  { fill: var(--dim); font-size: 11px; }
    .micro { fill: var(--faint); font-size: 10.5px; }
    .note  { fill: var(--faint); font-size: 10.5px; }
    .lane  { fill: var(--dim); font-size: 10.5px; }
    .lamp  { fill: var(--needs-you); }
  </style>

  <rect class="plate" x="0.5" y="0.5" width="1159" height="511" rx="20"/>

  <text class="mono label" x="36" y="52">注意力</text>
  <text class="sans title" x="36" y="88">六个会话同时跑，其中只有一个在等你。</text>
  <line class="hair" x1="36" y1="110" x2="1124" y2="110"/>

  <rect class="away" x="500" y="138" width="360" height="190" rx="10"/>
  <text class="sans micro" x="680" y="130" text-anchor="middle">你不在的这段时间</text>

  <rect class="track" x="262" y="150" width="862" height="10" rx="5"/>
  <rect class="track" x="262" y="182" width="862" height="10" rx="5"/>
  <rect class="track" x="262" y="214" width="862" height="10" rx="5"/>
  <rect class="track" x="262" y="246" width="862" height="10" rx="5"/>
  <rect class="track" x="262" y="278" width="862" height="10" rx="5"/>
  <rect class="track" x="262" y="310" width="862" height="10" rx="5"/>

  <text class="mono lane" x="250" y="159" text-anchor="end">grok-build · blog-engine</text>
  <rect x="262" y="150" width="298" height="10" rx="5" fill="var(--working)"/>
  <rect x="560" y="150" width="564" height="10" rx="5" fill="var(--done)"/>

  <text class="mono lane" x="250" y="191" text-anchor="end">claude-code · api-server</text>
  <rect x="262" y="182" width="238" height="10" rx="5" fill="var(--working)"/>
  <rect x="500" y="182" width="360" height="10" rx="5" fill="var(--needs-you)"/>
  <rect x="860" y="182" width="180" height="10" rx="5" fill="var(--working)"/>
  <rect x="1040" y="182" width="84" height="10" rx="5" fill="var(--done)"/>
  <circle class="lamp" cx="500" cy="187" r="16" opacity="0.07"/>
  <circle class="lamp" cx="500" cy="187" r="11" opacity="0.18"/>
  <circle class="lamp" cx="500" cy="187" r="4.4"/>

  <text class="mono lane" x="250" y="223" text-anchor="end">codex · webhook-relay</text>
  <rect x="262" y="214" width="438" height="10" rx="5" fill="var(--working)"/>
  <rect x="700" y="214" width="424" height="10" rx="5" fill="var(--done)"/>

  <text class="mono lane" x="250" y="255" text-anchor="end">opencode · pt-toolkit</text>
  <rect x="262" y="246" width="618" height="10" rx="5" fill="var(--working)"/>
  <rect x="880" y="246" width="244" height="10" rx="5" fill="var(--done)"/>

  <text class="mono lane" x="250" y="287" text-anchor="end">kimi-code · blog-engine</text>
  <rect x="262" y="278" width="378" height="10" rx="5" fill="var(--working)"/>
  <rect x="640" y="278" width="484" height="10" rx="5" fill="var(--done)"/>

  <text class="mono lane" x="250" y="319" text-anchor="end">pi · agent-session-center</text>
  <rect x="262" y="310" width="698" height="10" rx="5" fill="var(--working)"/>
  <rect x="960" y="310" width="164" height="10" rx="5" fill="var(--done)"/>

  <text class="sans micro" x="262" y="346">你起了六个</text>
  <text class="sans micro" x="1124" y="346" text-anchor="end">现在</text>

  <line class="hair" x1="36" y1="372" x2="1124" y2="372"/>

  <rect class="node" x="56.5"  y="390.5" width="244" height="54" rx="8"/>
  <rect class="node" x="324.5" y="390.5" width="244" height="54" rx="8"/>
  <rect class="node" x="592.5" y="390.5" width="244" height="54" rx="8"/>
  <rect class="node" x="860.5" y="390.5" width="243" height="54" rx="8"/>

  <text class="mono step" x="72"  y="414">needs-you</text>
  <text class="mono micro" x="72"  y="433">pendingApprovals 非空</text>
  <text class="sans step" x="340" y="414">飞书推送</text>
  <text class="sans micro" x="340" y="433">你手机上一张卡</text>
  <text class="sans step" x="608" y="414">你点批准</text>
  <text class="sans micro" x="608" y="433">决定往回走</text>
  <text class="sans step" x="876" y="414">同一个 PTY 继续</text>
  <text class="sans micro" x="876" y="433">没重启，也没丢东西</text>

  <path class="wire" d="M301 417.5 H323" marker-end="url(#z2)"/>
  <path class="wire" d="M569 417.5 H591" marker-end="url(#z2)"/>
  <path class="wire" d="M837 417.5 H859" marker-end="url(#z2)"/>

  <text class="sans note" x="36" y="488">其余五个不会打扰你。只有珊瑚这一场会开口 —— 而且它会一直问下去，跨重启，直到你回答。</text>

  <defs>
    <marker id="z2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L7 4 L0 7 z" fill="var(--dim)"/>
    </marker>
  </defs>
</svg>
