name: Publish release

# 把**一次既有构建**的产物挂到指定 Release 上，可选地把它发布出去。
#
# 存在的理由：产物已经在 GitHub 上，把它拉回本地再传回去要绕一整圈国际链路 —— 本机实测
# ~22 KB/s，94 MB 要一个小时，而且中途重定向还会失败。让 runner 从同一次运行里直接取产物
# 挂到 Release，几秒钟完事，链路不出 GitHub。
#
# 这个工作流**不构建任何东西**：它只搬运既有产物、校验校验值、挂上去。发布仍然是人工动作 ——
# 必须手动触发，且必须显式给出 run id 与 tag，两个值都不猜。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要挂到的 Release tag（如 v1.0.1）'
        required: true
        type: string
      run_id:
        description: '产出该产物的构建运行 id（release-windows.yml / release-linux.yml / release-mac.yml 任一）'
        required: true
        type: string
      publish:
        description: '挂上后是否把这个 draft Release 正式发布出去'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 检出必须排在下载之前：actions/checkout 默认 clean: true，会先跑
      # `git clean -ffdx`。放在「Download the artifacts」后面会把刚下载的 dl/ 直接删掉。
      - name: Check out the repository
        # 只是为了拿到 scripts/merge-mac-update-metadata.cjs —— 这个工作流不构建任何东西。
        uses: actions/checkout@v4

      - name: Download the artifacts from that run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --dir dl
          echo '--- downloaded ---'
          find dl -type f -exec ls -l {} +

      - name: Merge the per-architecture macOS update metadata
        # macOS 是唯一一个更新元数据不带架构后缀的平台：electron-updater 的
        # Provider.getChannelFilePrefix() 只在 linux 上追加架构（arm64 Linux 会去取
        # latest-linux-arm64.yml），darwin 恒返回裸的 -mac。所以 Mac 永远只请求
        # latest-mac.yml 这一个文件，并期望它的 files: 数组列出所有架构的产物，
        # 再由 MacUpdater.filterFilesForArch() 按 URL 里的 "arm64" 字样筛选。
        #
        # release-mac.yml 把 arm64 / x64 拆成两个 matrix job（为的是各自在原生 runner 上
        # 验证，而不是让 x64 二进制跑在 Rosetta 下），于是两个 artifact 各带一份只覆盖自己
        # 架构的 latest-mac.yml。两份同名文件没法同时挂到 Release —— GitHub 会回 422
        # `ReleaseAsset.name already exists`；而 gh release upload 是一次传整个文件列表，
        # 这一个冲突就会中止整步，留下「有元数据、有校验值、但没有二进制」的 Release，
        # 比什么都不上传更糟：已安装的 Mac 会被提示更新、然后下载 404。
        #
        # 脚本自己会断言被引用的产物确实都在本次运行里，并删掉各架构的输入文件，
        # 保证合并后的 latest-mac.yml 是唯一一份。没有 mac 元数据时它静默通过
        # （Windows / Linux 运行本来就没有）。
        run: |
          node scripts/merge-mac-update-metadata.cjs dl dl/latest-mac.yml

      - name: Verify every artifact against its published checksum
        # 不写死文件名：一次运行可能是 Windows（Setup-*.exe）、Linux（AppImage + deb）
        # 或 macOS（dmg + zip）。凡是带了 .sha256 的产物，逐个比对，缺一个都拒绝挂载。
        run: |
          set -euo pipefail
          mapfile -t sums < <(find dl -type f -name '*.sha256')
          if [ ${#sums[@]} -eq 0 ]; then
            echo 'No .sha256 files found in the artifact.' >&2
            exit 1
          fi
          for sum in "${sums[@]}"; do
            name=$(basename "$sum" .sha256)
            artifact=$(find dl -type f -name "$name" -print -quit)
            if [ -z "$artifact" ]; then
              echo "Checksum file has no matching artifact: $name" >&2
              exit 1
            fi
            expected=$(cut -d' ' -f1 "$sum" | tr -d '\r\n' | tr '[:upper:]' '[:lower:]')
            actual=$(sha256sum "$artifact" | cut -d' ' -f1)
            printf '%-52s expected=%s\n' "$name" "$expected"
            printf '%-52s   actual=%s\n' '' "$actual"
            if [ "$expected" != "$actual" ]; then
              echo "Checksum mismatch for $name — refusing to attach." >&2
              exit 1
            fi
          done
          echo "All ${#sums[@]} checksum(s) matched."

      - name: Attach the artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t payload < <(find dl -type f ! -name '*.sha256' | sort)
          mapfile -t sums < <(find dl -type f -name '*.sha256' | sort)
          if [ ${#payload[@]} -eq 0 ]; then
            echo 'Nothing to attach — the artifact contained no payload files.' >&2
            exit 1
          fi

          # 二进制与更新元数据先上，.sha256 最后上。一个指向不存在产物的校验值文件是有害的
          # （它替一个下不动的产物背书），这个顺序让「整步中途失败」也到不了那个状态：
          # 载荷传不完就根本不会去传校验值，最多是缺校验值，而不是校验值悬空。
          printf 'attaching %s payload file(s)\n' "${#payload[@]}"
          printf '  %s\n' "${payload[@]}"
          gh release upload "$TAG" "${payload[@]}" \
            --repo "${{ github.repository }}" --clobber

          printf 'attaching %s checksum file(s)\n' "${#sums[@]}"
          gh release upload "$TAG" "${sums[@]}" \
            --repo "${{ github.repository }}" --clobber

      - name: Publish the release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false
          gh release view "$TAG" --repo "${{ github.repository }}" \
            --json tagName,isDraft,assets \
            --jq '"tag=\(.tagName) draft=\(.isDraft) assets=\(.assets|length)"'
