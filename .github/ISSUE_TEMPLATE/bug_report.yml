name: Bug report
description: 报告一个可复现的问题（bug）
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间反馈。

        提交前请先搜索现有 issue，大概率已经有人踩过同一个坑：
        https://github.com/fatedawn/agent-session-center/issues

        **安全漏洞请不要公开提交**，见下面的说明。

  - type: input
    id: version
    attributes:
      label: 版本号
      description: 应用的版本号（设置 → 关于，或安装包文件名里的版本段）
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
      validations:
        required: true

  - type: input
    id: harness
    attributes:
      label: CLI / Harness 名称
      description: 出问题的那个 Coding CLI，例如 Codex CLI、Claude Code、OpenCode、DeepSeek Harness、Grok Build等。桌面终端本身的问题请填「ASC 本身」。
      placeholder: "Codex CLI"
    validations:
      required: false

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 一步一步写，从打开应用开始。越具体，别人越容易复现。
      placeholder: |
        1. 启动 Agent Session Center
        2. 扫描到 Codex CLI，创建会话
        3. 让 Codex 执行一个需要权限确认的命令
        4. 切到别的会话再切回来
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你以为会发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？有没有报错？
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: |
        相关日志片段直接贴在下面即可（Ctrl+A 全选前请先检查是否含有密钥、token 等敏感信息）。

        - 桌面端：主进程日志中的 `[asc]` 前缀行
        - 诊断日志：用户数据目录下的 `logs/asc-diagnostic.jsonl` 里的 `[asc] spawn` 行
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前自查
      options:
        - label: 我已搜索过现有 issue，没有找到相同问题
          required: true
        - label: 我贴出的日志已检查，不含密钥 / token / 内部地址
          required: false
