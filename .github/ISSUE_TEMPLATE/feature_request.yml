name: Feature request 功能建议
description: Suggest a new capability or an improvement / 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please read the [README](https://github.com/fatedawn/agent-session-center#readme) first and check that this is not already implemented.
        建议先读一遍 [README](https://github.com/fatedawn/agent-session-center#readme)，确认这个需求目前确实还没有被实现。

  - type: textarea
    id: scenario
    attributes:
      label: The situation 使用场景
      description: What were you doing when you hit the gap? Describe the actual workflow, not an abstract feature name. / 你在做什么的时候遇到了这个缺口？描述具体的工作流，而不是抽象的功能名。
      placeholder: |
        I keep 6 agents open at once. When I come back after a while, I have to
        click through every terminal tab to find the one waiting on me.
        我同时开着 6 个 Agent，跑一段时间后回来，只能一个个终端标签页点过去看哪个在等我。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like 期望方案
      description: How should it work? If you have several ideas, list them all. / 你希望它怎么工作？如果有多个思路，都写出来。
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What you do today 你的替代做法
      description: How do you work around this now — a script, another tool, or just putting up with it? / 现在这件事你是怎么绕过去的？用了脚本、别的工具，还是只能忍着？
      placeholder: "A shell script that polls the log file / 目前用一个 shell 脚本轮询日志文件"
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit 提交前自查
      options:
        - label: I searched existing issues and PRs and found no duplicate / 我已搜索过现有 issue 和 PR，没有重复的请求
          required: true
        - label: I am willing to implement this myself (I will say so in the comments) / 这个需求我愿意自己实现（我会在评论里说明）
          required: false
