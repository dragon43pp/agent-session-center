name: Publish release

# 把**一次既有构建**的产物挂到指定 Release 上，可选地把它发布出去。
#
# 存在的理由：产物已经在 GitHub 上，把它拉回本地再传回去要绕一整圈国际链路 —— 本机实测
# ~22 KB/s，94 MB 要一个小时，而且中途重定向还会失败。让 runner 从同一次运行里直接取产物
# 挂到 Release，几秒钟完事，链路不出 GitHub。
#
# 这个工作流**不构建任何东西**：它只搬运既有产物、校验校验值、挂上去。发布仍然是人工动作 ——
# 必须手动触发，且必须显式给出 run id 与 tag，两个值都不猜。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要挂到的 Release tag（如 v1.0.1）'
        required: true
        type: string
      run_id:
        description: '产出该产物的构建运行 id（release-windows.yml / release-linux.yml / release-mac.yml 任一）'
        required: true
        type: string
      publish:
        description: '挂上后是否把这个 draft Release 正式发布出去'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download the artifacts from that run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --dir dl
          echo '--- downloaded ---'
          find dl -type f -exec ls -l {} +

      - name: Verify every artifact against its published checksum
        # 不写死文件名：一次运行可能是 Windows（Setup-*.exe）、Linux（AppImage + deb）
        # 或 macOS（dmg + zip）。凡是带了 .sha256 的产物，逐个比对，缺一个都拒绝挂载。
        run: |
          set -euo pipefail
          mapfile -t sums < <(find dl -type f -name '*.sha256')
          if [ ${#sums[@]} -eq 0 ]; then
            echo 'No .sha256 files found in the artifact.' >&2
            exit 1
          fi
          for sum in "${sums[@]}"; do
            name=$(basename "$sum" .sha256)
            artifact=$(find dl -type f -name "$name" -print -quit)
            if [ -z "$artifact" ]; then
              echo "Checksum file has no matching artifact: $name" >&2
              exit 1
            fi
            expected=$(cut -d' ' -f1 "$sum" | tr -d '\r\n' | tr '[:upper:]' '[:lower:]')
            actual=$(sha256sum "$artifact" | cut -d' ' -f1)
            printf '%-52s expected=%s\n' "$name" "$expected"
            printf '%-52s   actual=%s\n' '' "$actual"
            if [ "$expected" != "$actual" ]; then
              echo "Checksum mismatch for $name — refusing to attach." >&2
              exit 1
            fi
          done
          echo "All ${#sums[@]} checksum(s) matched."

      - name: Attach the artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          mapfile -t files < <(find dl -type f)
          printf 'attaching %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" \
            --repo "${{ github.repository }}" --clobber

      - name: Publish the release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false
          gh release view "$TAG" --repo "${{ github.repository }}" \
            --json tagName,isDraft,assets \
            --jq '"tag=\(.tagName) draft=\(.isDraft) assets=\(.assets|length)"'
